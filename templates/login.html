<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stack-it - Login</title>
    <link href="../static/css/output.css" rel="stylesheet"/>
</head>

<body class="min-h-screen bg-gradient-to-br from-red-200 to-orange-300 flex items-center justify-center p-4 w-full">
  <div class="w-full max-w-xl bg-slate-200 font-mono rounded-xl shadow-xl overflow-hidden">
    <!-- Window bar -->
    <div class="bg-slate-300 px-4 py-2 flex w-full items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-red-500"></div>
      <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
      <div class="w-3 h-3 rounded-full bg-green-500"></div>
    </div>

    <!-- Code-styled login form -->
    <form id="login-form" class="p-6 space-y-4 text-sm leading-relaxed">
      <p><span class="text-red-400">let</span> <span class="text-teal-600">Login</span> <span class="text-gray-400">=</span></p>

      <!-- Username/Email input -->
      <div class="pl-4">
        <label for="login-email" class="inline-block mr-2 text-gray-400">email:</label>
        <input
          id="login-email"
          name="email"
          type="email"
          placeholder="your@email.com"
          required
          class="bg-transparent text-slate-950 border-none outline-none w-2/3 focus:ring-0 focus:outline-none"
        />
      </div>

      <!-- Password input -->
      <div class="pl-4">
        <label for="login-password" class="inline-block mr-2 text-gray-400">password:</label>
        <input
          id="login-password"
          name="password"
          type="password"
          placeholder="••••••••"
          required
          class="bg-transparent text-slate-950 border-none outline-none w-2/3 focus:ring-0 focus:outline-none"
        />
      </div>

      <!-- Submit button -->
      <div class="pt-4 pl-4">
        <button
          type="submit"
          class="text-gray-600 bg-slate-300 px-5 py-2 rounded hover:bg-gray-700 hover:text-white transition"
        >
            login
        </button>

        <p class="pt-2">Need an account?
          <button
            type="button"
            data-modal-target="signupModal"
            data-modal-toggle="signupModal"
            class="text-orange-900 shadow-md shadow-orange-400/50 bg-gradient-to-br from-red-300 to-orange-400 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-pink-100 dark:focus:ring-pink-300 font-medium rounded-md text-xs px-5 py-2.5 text-center me-2 mb-2"
          >
            Sign Up
          </button>
        </p>
      </div>
    </form>
  </div>

  <!-- Signup Modal -->
  <div id="signupModal" tabindex="-1" aria-hidden="true"
       class="hidden fixed top-0 left-0 right-0 z-50 flex items-center justify-center w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-modal sm:h-full bg-black/40">
    <div class="relative w-full max-w-xl md:h-auto font-mono">
      <div class="bg-slate-200 rounded-xl shadow-xl overflow-hidden">
        <!-- Terminal window bar -->
        <div class="bg-slate-300 px-4 py-2 flex w-full items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-red-500"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
          <button type="button"
                  class="ml-auto text-gray-500 hover:text-red-500 text-xs font-bold"
                  data-modal-hide="signupModal">✕</button>
        </div>

        <!-- Code-styled signup form -->
        <form id="signup-form" class="p-6 space-y-4 text-sm leading-relaxed">
          <p><span class="text-red-400">let</span> <span class="text-teal-600">SignUp</span> <span class="text-gray-400">=</span></p>

          <!-- Username input -->
          <div class="pl-4">
            <label for="signup-username" class="inline-block mr-2 text-gray-400">username:</label>
            <input
              id="signup-username"
              name="username"
              type="text"
              placeholder="username"
              required
              class="bg-transparent text-slate-950 border-none outline-none w-2/3 focus:ring-0"
            />
          </div>

          <!-- Email input -->
          <div class="pl-4">
            <label for="signup-email" class="inline-block mr-2 text-gray-400">email:</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
              class="bg-transparent text-slate-950 border-none outline-none w-2/3 focus:ring-0"
            />
          </div>

          <!-- Password input -->
          <div class="pl-4">
            <label for="signup-password" class="inline-block mr-2 text-gray-400">password:</label>
            <input
              id="signup-password"
              name="password"
              type="password"
              placeholder="••••••••"
              required
              class="bg-transparent text-slate-950 border-none outline-none w-2/3 focus:ring-0"
            />
          </div>

          <!-- Submit -->
          <div class="pt-4 pl-4">
            <button type="submit"
                    class="text-gray-600 bg-slate-300 px-5 py-2 rounded hover:bg-green-400 hover:text-black transition">
              Sign Up
            </button>
            <p class="pt-2 text-xs text-gray-500">
              Already have an account?
              <button type="button" data-modal-hide="signupModal" class="text-red-300 hover:underline">Login</button>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>

  <script>
    // Login form handler
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const result = await res.json();

        if (res.ok) {
          // Redirect to dashboard
          window.location.href = result.redirect;
        } else {
          alert(result.error);
        }
      } catch (error) {
        alert('Login failed. Please try again.');
        console.error('Error:', error);
      }
    });

    // Signup form handler
    const signupForm = document.getElementById('signup-form');
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('signup-username').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      try {
        const res = await fetch('/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });

        const result = await res.json();

        if (res.ok) {
          alert('Signup successful! Redirecting to dashboard...');
          // Redirect to dashboard
          window.location.href = result.redirect;
        } else {
          alert(result.error);
        }
      } catch (error) {
        alert('An error occurred. Please try again.');
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
