<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/output.css">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />

</head>
<body style="height: fit-content; width: 100vw;">
<!-- Include the navigation bar -->
{% include '_navbar.html' %}

<main  class="main-cont" style="width: 100%; height: 100vh; display: flex; flex-direction: column; font-size: 50vw; text-align: center; overflow: clip; line-height: 5vh; justify-content: center; margin: 0px auto; padding: 20px; color: rgba(5,7,8,0.65)">
<p style="-webkit-text-stroke: 1px rgba(0,0,0,0.78);">404</p>
</main>
<div style="position: absolute; top: 50%; height: 100px; align-content: center; font-size: 24px; width: 100vw; justify-content: center ;background-color: rgba(5,7,8,0.84); color: white; font-weight: lighter; text-align: center">
    <p>Whoops...this page was not found.  Please check your URL link and try again. </p>
</div>
<script>
    // Toggle user dropdown menu
  const toggle = document.getElementById('user-menu-toggle');
  const dropdown = document.getElementById('user-dropdown');

  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  });

  // Hide menu when clicking elsewhere
  document.addEventListener('click', function () {
    dropdown.style.display = 'none';
  });
</script>

</body>
</html>
