<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Post Title</title>
    <link href="../static/css/styles.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<link rel="icon" type="image/png" href="../static/images/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="../static/images/favicon-96x96.png/favicon.svg" />
<link rel="shortcut icon" href="../static/images/favicon-96x96.png/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="../static/images/favicon-96x96.png/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Stack-it.dev" />
<link rel="manifest" href="../static/images/favicon-96x96.png/site.webmanifest" />
</head>
 <body>
<!-- Include the navigation bar -->
{% include '_navbar.html' %}
<div class="main-header" style="width: 100%; height: auto; min-height: 90px; background-color: rgba(5,7,8,0.86); border-bottom: #050708 solid 1px; padding: 23px; display: flex; flex-direction: row;">
 <div style="width: 100%; height: inherit; display: flex; flex-direction: column; font-weight: lighter; color: white; align-content: center; position: relative">
    <div class="post-title-container" style="display: flex; flex-direction: row; position: relative; justify-content: space-between; width: 100%; align-items: flex-start; gap: 20px;">
        <div style="display: flex; flex-direction: column;">
            <h4 style="color: white; font-weight: lighter;">{{ title }}</h4>
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="position:relative; display:inline-block;">
                <img src="{{ avatar_url(author_user) }}" alt="avatar" style="width:22px;height:22px;border-radius:50%;object-fit:cover;">
                {% if is_online(author_user) %}
                <span title="Online" style="position:absolute; bottom:-1px; right:-1px; width:8px; height:8px; background:#22c55e; border:2px solid #1b1f23; border-radius:50%; display:inline-block;"></span>
                {% endif %}
              </div>
              <p style="font-size: 12px; margin:0;">by {{ author_user.username }} • {{ created_at }}</p>
            </div>
        </div>
        
        <div style="display: flex; flex-direction: row; gap: 15px; align-items: center; flex-shrink: 0;">
            <!-- Favorite button -->
            <button id="favorite-button" class="favorite-btn" data-post-id="{{ post_id }}" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; color: white; white-space: nowrap;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16" id="favorite-icon">
                    <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15"/>
                </svg>
                <span id="favorite-text" style="margin-left: 5px;">Add to Favorites</span>
            </button>

            {% if is_author or is_admin %}
            <!-- Three-dot menu for post actions -->
            <div class="post-menu-container" style="display: flex; flex-direction: row; position: relative;">
                <div class="post-menu-wrapper" style="position: relative;">
                    <a href="#" class="post-menu-toggle" data-post-id="{{ post_id }}" style="display: flex; align-items: center; color: white; text-decoration: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" class="bi bi-three-dots" viewBox="0 0 16 16">
                            <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                        </svg>
                    </a>
                    <!-- Post dropdown menu -->
                    <div class="post-dropdown hidden" style="position: absolute; top: 100%; right: 0; margin-top: 8px; background-color: #121212; min-width: max-content; border: 1px solid rgba(55, 65, 81, 0.5); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); z-index: 999; overflow: hidden;">
                        <a href="/edit-post/{{ post_id }}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
                            </svg>
                            <span>Edit Post</span>
                        </a>
                        <a href="/delete-post/{{ post_id }}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                            </svg>
                            <span>Delete Post</span>
                        </a>
                    </div>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
    
    <div class="tags-container" style="display: flex; flex-direction: row; margin-top: 10px; position: relative;">
        <div class="post-tags">
            {% for tag in tags %}
                <span class="tag">#{{ tag }}</span>
            {% endfor %}
        </div>
    </div>
 </div>

    </div>
<div class="main-post-content" style="width: 100%; display: flex; flex-direction: row; min-height: calc(100vh - 135px); position: relative; overflow: auto; background-color: rgba(12,12,12,0.7) ">
    <div class="content-post" style="flex: 1; height: inherit; display: flex; flex-direction: column; font-weight: lighter; color: white; align-content: start; position: relative; padding: 20px;">
        <div class="prose">
            {{ content|safe }}
        </div>
    </div>
    <div class="post-sidenav" style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; background-color: rgba(5,7,8,0.47); min-height: 200px; color: white; font-weight: lighter; padding: 10px">
       <header>
           <p> On This Page</p>
    </header>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Initialize Highlight.js for syntax highlighting
  if (typeof hljs !== 'undefined') {
    document.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightElement(block);
    });
  }

  // Sidebar navigation links
  const sideNav = document.querySelector(".post-sidenav");
  const sideNavLinks = document.createElement("nav");
  sideNavLinks.classList.add("sidenav-links");

  const headers = document.querySelectorAll(
    ".content-post .post-content-headers, .content-post .post-content-headers-2, .prose h2, .prose h3"
  );

  headers.forEach((header, index) => {
    const id = header.textContent.trim().toLowerCase().replace(/\s+/g, "-");
    header.id = id;

    const link = document.createElement("a");
    link.href = `#${id}`;
    link.textContent = header.textContent.trim();
    link.classList.add("sidenav-link");

    sideNavLinks.appendChild(link);
  });

  sideNav.appendChild(sideNavLinks);

  // Scrollspy functionality - highlight active section in sidebar
  const allSidenavLinks = document.querySelectorAll('.sidenav-link');
  const headersArray = Array.from(headers);

  function updateActiveLink() {
    // Get current scroll position with offset for header
    const scrollPos = window.scrollY + 100;

    // Find the current section
    let currentSection = null;
    headersArray.forEach((header) => {
      const headerTop = header.offsetTop;
      if (scrollPos >= headerTop) {
        currentSection = header;
      }
    });

    // Update active link
    allSidenavLinks.forEach((link) => {
      link.classList.remove('active');
    });

    if (currentSection) {
      const activeLink = document.querySelector(`.sidenav-link[href="#${currentSection.id}"]`);
      if (activeLink) {
        activeLink.classList.add('active');

        // Auto-scroll sidebar to keep active link visible and centered
        const sidenavLinksContainer = document.querySelector('.sidenav-links');
        if (sidenavLinksContainer) {
          // Get link position relative to its parent container
          const containerRect = sidenavLinksContainer.getBoundingClientRect();
          const linkRect = activeLink.getBoundingClientRect();
          const linkTopRelative = linkRect.top - containerRect.top + sidenavLinksContainer.scrollTop;
          const linkHeight = activeLink.offsetHeight;
          const containerHeight = sidenavLinksContainer.clientHeight;
          const scrollTop = sidenavLinksContainer.scrollTop;
          const viewportTop = scrollTop;
          const viewportBottom = scrollTop + containerHeight;

          // Check if link is outside the visible area
          if (linkTopRelative < viewportTop || (linkTopRelative + linkHeight) > viewportBottom) {
            // Center the link in the sidebar
            const desiredScrollTop = linkTopRelative - (containerHeight / 2) + (linkHeight / 2);
            sidenavLinksContainer.scrollTo({
              top: Math.max(0, desiredScrollTop),
              behavior: 'smooth'
            });
          }
        }
      }
    }
  }

  // Listen for scroll events
  let scrollTimeout;
  window.addEventListener('scroll', function() {
    if (scrollTimeout) {
      window.cancelAnimationFrame(scrollTimeout);
    }
    scrollTimeout = window.requestAnimationFrame(updateActiveLink);
  });

  // Initial update
  updateActiveLink();

  // Smooth scroll when clicking sidebar links
  allSidenavLinks.forEach((link) => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('href').substring(1);
      const targetElement = document.getElementById(targetId);

      if (targetElement) {
        // Immediately update active state
        allSidenavLinks.forEach((l) => l.classList.remove('active'));
        this.classList.add('active');

        // Auto-scroll sidebar to show clicked link
        const sidenavLinksContainer = document.querySelector('.sidenav-links');
        if (sidenavLinksContainer) {
          // Get link position relative to scroll container
          const containerRect = sidenavLinksContainer.getBoundingClientRect();
          const linkRect = this.getBoundingClientRect();
          const linkTopRelative = linkRect.top - containerRect.top + sidenavLinksContainer.scrollTop;
          const linkHeight = this.offsetHeight;
          const containerHeight = sidenavLinksContainer.clientHeight;

          // Center the clicked link in the sidebar
          const desiredScrollTop = linkTopRelative - (containerHeight / 2) + (linkHeight / 2);
          sidenavLinksContainer.scrollTo({
            top: Math.max(0, desiredScrollTop),
            behavior: 'smooth'
          });
        }

        // Scroll page with offset for header
        const offsetTop = targetElement.offsetTop - 80;
        window.scrollTo({
          top: offsetTop,
          behavior: 'smooth'
        });
      }
    });
  });

  // Three-dot dropdown menu functionality
  const postMenuToggle = document.querySelector('.post-menu-toggle');
  if (postMenuToggle) {
    postMenuToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();

      const dropdown = this.nextElementSibling;
      dropdown.classList.toggle('hidden');
    });

    // Close dropdown when clicking elsewhere
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.post-menu-toggle')) {
        const dropdown = document.querySelector('.post-dropdown');
        if (dropdown) {
          dropdown.classList.add('hidden');
        }
      }
    });
  }
  
  // Favorite button functionality
  const favoriteButton = document.getElementById('favorite-button');
  const favoriteIcon = document.getElementById('favorite-icon');
  const favoriteText = document.getElementById('favorite-text');
  
  if (favoriteButton) {
    const postId = favoriteButton.getAttribute('data-post-id');
    
    // Check if post is already favorited
    checkFavoriteStatus(postId);
    
    // Add click event to toggle favorite
    favoriteButton.addEventListener('click', function() {
      toggleFavorite(postId);
    });
  }
  
  // Function to check if post is already favorited
  function checkFavoriteStatus(postId) {
    fetch(`/api/user/favorites`)
      .then(response => response.json())
      .then(favorites => {
        // Check if this post is in the user's favorites
        const isFavorited = favorites.some(fav => fav.id == postId);
        updateFavoriteButton(isFavorited);
      })
      .catch(error => {
        console.error('Error checking favorite status:', error);
      });
  }
  
  // Function to toggle favorite status
  function toggleFavorite(postId) {
    fetch(`/api/posts/${postId}/favorite`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        // Update button appearance based on new favorite status
        updateFavoriteButton(data.favorited);
      } else {
        console.error('Error toggling favorite:', data.error);
      }
    })
    .catch(error => {
      console.error('Error toggling favorite:', error);
    });
  }
  
  // Function to update the favorite button appearance
  function updateFavoriteButton(isFavorited) {
    if (isFavorited) {
      // Change to filled heart
      favoriteIcon.innerHTML = '<path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/>';
      favoriteIcon.setAttribute('fill', '#ff5722');
      favoriteText.textContent = 'Remove from Favorites';
      favoriteButton.style.color = '#ff5722';
    } else {
      // Change to outline heart
      favoriteIcon.innerHTML = '<path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143q.09.083.176.171a3 3 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15"/>';
      favoriteIcon.setAttribute('fill', 'currentColor');
      favoriteText.textContent = 'Add to Favorites';
      favoriteButton.style.color = 'white';
    }
  }
});
</script>
</body>
<style>
/* Dropdown menu styles */
.post-dropdown a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #e5e7eb;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.15s ease-in-out;
}

.post-dropdown a:first-child {
    border-bottom: 1px solid rgba(55, 65, 81, 0.5);
}

.post-dropdown a:hover {
    background-color: rgba(249, 115, 22, 0.1);
    color: #f97316;
}

.post-dropdown a:last-child:hover {
    background-color: rgba(239, 68, 68, 0.1);
    color: #ef4444;
}

.post-dropdown a svg {
    opacity: 0.7;
    flex-shrink: 0;
}

.post-dropdown a:hover svg {
    opacity: 1;
}

.hidden {
    display: none !important;
}

.post-content-headers {
    font-weight: 300;
    color: white;
    font-size: 20px;
    margin-bottom: 20px;
    margin-top: 20px;

}
.post-content-headers-2 {

    font-weight: 300;
}
    html {
        scroll-behavior: smooth;
    }

    .sidenav-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 10px;
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 8px;
    }

    /* Custom scrollbar for sidebar */
    .sidenav-links::-webkit-scrollbar {
        width: 6px;
    }

    .sidenav-links::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 3px;
    }

    .sidenav-links::-webkit-scrollbar-thumb {
        background: rgba(125, 211, 252, 0.3);
        border-radius: 3px;
    }

    .sidenav-links::-webkit-scrollbar-thumb:hover {
        background: rgba(125, 211, 252, 0.5);
    }

    .sidenav-link {
        color: #9ca3af;
        font-size: 14px;
        text-decoration: none;
        transition: all 0.2s ease;
        padding-left: 12px;
        padding-top: 4px;
        padding-bottom: 4px;
        border-left: 2px solid transparent;
        display: block;
        position: relative;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sidenav-link:hover {
        color: #e5e7eb;
        border-left: 2px solid #7dd3fc;
        padding-left: 14px;
    }

    .sidenav-link.active {
        color: #ffffff;
        border-left: 2px solid #f97316;
        padding-left: 14px;
        font-weight: 500;
    }

    .post-content-headers {
        font-weight: 300;
        color: white;
        font-size: 20px;
        margin-bottom: 20px;
        margin-top: 20px;
    }

    .post-content-headers-2 {
        font-weight: 300;
        color: #cbd5e1; /* slate-300 tone */
        font-size: 16px;
        margin-top: 16px;
    }

    .post-content-bodies {
        font-size: 14px;
        line-height: 1.7;
        color: #d1d5db; /* subtle gray for readability */
        margin-bottom: 20px;
    }

</style>
</html>
