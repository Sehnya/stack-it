<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Post Title</title>
    <link href="../static/css/styles.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<link rel="icon" type="image/png" href="../static/images/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="../static/images/favicon-96x96.png/favicon.svg" />
<link rel="shortcut icon" href="../static/images/favicon-96x96.png/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="../static/images/favicon-96x96.png/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Stack-it.dev" />
<link rel="manifest" href="../static/images/favicon-96x96.png/site.webmanifest" />
</head>
 <body>
<!-- Include the navigation bar -->
{% include '_navbar.html' %}
<div class="main-header" style="width: 100%; height: 90px; background-color: rgba(5,7,8,0.86); border-bottom: #050708 solid 1px; padding: 23px; display: flex; flex-direction: row;">
 <div style="width: 50%; height: inherit; display: flex; flex-direction: column; font-weight: lighter; color: white; align-content: center; position: relative">
    <div class="post-title-container" style="display: flex; flex-direction: row;  position: relative">
     <h4 style="color: white; font-weight: lighter;">{{ title }}</h4>
        <div class="tags-container" style="display: flex; flex-direction: row; margin-left: 18px; position: relative; justify-content: space-between ">
            <div class="post-tags" >
                {% for tag in tags %}
                	<span class="tag">#{{ tag }}</span>
                {% endfor %}

  </div>

        </div>
    </div>
    <p style="font-size: 12px; ">{{ created_at }}</p>
 </div>

    </div>
<div class="main-post-content" style="width: 100%; display: flex; flex-direction: row; height: 100%; position: relative; overflow: auto; background-color: rgba(12,12,12,0.7) ">
    <div class="content-post" style="width: inherit; height: inherit; display: flex; flex-direction: column; font-weight: lighter; color: white; align-content: start; position: relative; padding: 20px;">
        {{ content|safe }}
    </div>
    <div class="post-sidenav" style="width: 300px; height: 200vh; display: flex; flex-direction: column; background-color: rgba(5,7,8,0.47); min-height: 200px; color: white; font-weight: lighter; padding: 10px">
       <header>
           <p> On This Page</p>
    </header>
    <div class="sidenav-links" >
        <div class="sidenav-link">
        </div>
    </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const sideNav = document.querySelector(".post-sidenav");
  const sideNavLinks = document.createElement("nav");
  sideNavLinks.classList.add("sidenav-links");

  const headers = document.querySelectorAll(
    ".content-post .post-content-headers, .content-post .post-content-headers-2"
  );

  headers.forEach((header, index) => {
    const id = header.textContent.trim().toLowerCase().replace(/\s+/g, "-");
    header.id = id;

    const link = document.createElement("a");
    link.href = `#${id}`;
    link.textContent = header.textContent.trim();
    link.classList.add("sidenav-link");

    sideNavLinks.appendChild(link);
  });

  sideNav.appendChild(sideNavLinks);
});
</script>
</body>
<style>
.post-content-headers {
    font-weight: 300;
    color: white;
    font-size: 20px;
    margin-bottom: 20px;
    margin-top: 20px;

}
.post-content-headers-2 {

    font-weight: 300;
}
    html {
        scroll-behavior: smooth;
    }

    .sidenav-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 10px;
    }

    .sidenav-link {
        color: #ccc;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.2s ease;
        padding-left: 4px;
        border-left: 2px solid transparent;
        display: flex ;
        flex-flow: column ;
    }

    .sidenav-link:hover {
        color: #fff;
        border-left: 2px solid #7dd3fc; /* tailwind sky-300 or matching glow accent */
    }

    .post-content-headers {
        font-weight: 300;
        color: white;
        font-size: 20px;
        margin-bottom: 20px;
        margin-top: 20px;
    }

    .post-content-headers-2 {
        font-weight: 300;
        color: #cbd5e1; /* slate-300 tone */
        font-size: 16px;
        margin-top: 16px;
    }

    .post-content-bodies {
        font-size: 14px;
        line-height: 1.7;
        color: #d1d5db; /* subtle gray for readability */
        margin-bottom: 20px;
    }

</style>
</html>
