<div class="main-header" style="width: 100%; height: 90px; background-color: rgba(5,7,8,0.86); border-bottom: #050708 solid 1px; padding: 23px; display: flex; flex-direction: row;">
 <div style="width: 50%; height: inherit; display: flex; flex-direction: column; font-weight: lighter; color: white; align-content: center; position: relative">
    <div class="post-title-container" style="display: flex; flex-direction: row;  position: relative">
     <h4 style="color: white; font-weight: lighter;">{{ title }}</h4>
        <div class="tags-container" style="display: flex; flex-direction: row; margin-left: 18px; position: relative; ">
            <div class="post-tags" >
                {% for tag in tags %}
                	<span class="tag">#{{ tag }}</span>
                {% endfor %}

  </div>
        </div>
    </div>
    <p style="font-size: 12px; ">{{ created_at }}</p>
 </div>

    </div>
<div class="main-post-content" style="width: 100%; display: flex; flex-direction: row; height: 100%; position: relative; overflow: auto; background-color: rgba(12,12,12,0.7) ">
    <div class="content-post" style="width: inherit; height: inherit; display: flex; flex-direction: column; font-weight: lighter; color: white; align-content: start; position: relative; padding: 20px;">
        {{ content|safe }}
    </div>
    <div class="post-sidenav" style="width: 300px; height: 200vh; display: flex; flex-direction: column; background-color: rgba(5,7,8,0.47); min-height: 200px; color: white; font-weight: lighter; padding: 10px">
       <header>
           <p> On This Page</p>
    </header>
    <div class="sidenav-links" >
        <div class="sidenav-link">
        </div>
    </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const sideNav = document.querySelector(".post-sidenav");
  const sideNavLinks = document.createElement("nav");
  sideNavLinks.classList.add("sidenav-links");

  const headers = document.querySelectorAll(
    ".content-post .post-content-headers, .content-post .post-content-headers-2"
  );

  headers.forEach((header, index) => {
    const id = header.textContent.trim().toLowerCase().replace(/\s+/g, "-");
    header.id = id;

    const link = document.createElement("a");
    link.href = `#${id}`;
    link.textContent = header.textContent.trim();
    link.classList.add("sidenav-link");

    sideNavLinks.appendChild(link);
  });

  sideNav.appendChild(sideNavLinks);
});
</script>

    .sidenav-link {

        padding-left: 4px;
        border-left: 2px solid transparent;

    }

    .post-content-headers {
