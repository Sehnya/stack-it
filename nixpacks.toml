# Nixpacks configuration for Railway deployment
# This tells Nixpacks to use Bun and includes OpenSSL for Prisma

[phases.setup]
nixPkgs = ["bun", "openssl"]
aptPkgs = ["openssl", "libssl3"]

[phases.install]
cmds = ["cd backend && bun install"]

[phases.build]
cmds = ["cd backend && bunx prisma generate"]

[start]
cmd = "cd backend && bun run start"
